<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任務1:Poll vs Push</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.16.0/mqtt.min.js"></script>
<style>
 body{font-family:sans-serif;max-width:780px;margin:20px auto;padding:0 12px}
 input,select,button{font-size:16px;padding:6px;margin:2px}
 .cols{display:flex;gap:12px;flex-wrap:wrap}
 .col{flex:1;min-width:300px;border:1px solid #ccc;padding:8px;border-radius:6px}
 .log{height:170px;overflow:auto;background:#f7f7f7;padding:6px;font-size:14px}
 table{border-collapse:collapse;width:100%}
 td{border:1px solid #ccc;padding:4px 8px}
 .big{font-size:22px;font-weight:bold}
 .warn{background:#fff2cc;padding:6px;border-radius:4px}
</style>
</head>
<body>
<h2>任務 1:Poll 模式 vs Push 模式</h2>
<p class="warn">公共 Broker 人人可見,請勿輸入個人資料。Room 名稱請用「班別-組別」,例如 3A-g1。</p>
<p>連線狀態:<b id="conn">連線中…</b></p>
<div>
 Room:<input id="room" placeholder="例:3A-g1" size="10">
 Poll 間隔:
 <select id="interval">
  <option value="3">3 秒</option><option value="5" selected>5 秒</option><option value="10">10 秒</option>
 </select>
</div>
<div>
 <button id="start">① 開始實驗(60 秒)</button>
 <button id="stop">停止</button>
 <button id="bot">② 啟動機器人(全組一人按即可)</button>
</div>
<p>剩餘時間:<span class="big" id="left">60</span> 秒</p>

<div class="cols">
 <div class="col">
  <h3>Poll(模擬):定時主動詢問</h3>
  <table>
   <tr><td>詢問次數(Request)</td><td id="p_req">0</td></tr>
   <tr><td>有新訊息的詢問</td><td id="p_hit">0</td></tr>
   <tr><td>白問(無新訊息)</td><td id="p_empty">0</td></tr>
   <tr><td>白問比例</td><td id="p_ratio">-</td></tr>
   <tr><td>收到訊息總數</td><td id="p_msgs">0</td></tr>
   <tr><td>平均延遲</td><td id="p_delay">-</td></tr>
  </table>
  <div class="log" id="p_log"></div>
 </div>
 <div class="col">
  <h3>Push:有新訊息才通知</h3>
  <table>
   <tr><td>額外詢問次數</td><td>0</td></tr>
   <tr><td>收到訊息總數</td><td id="s_msgs">0</td></tr>
   <tr><td>無新訊息時收到的通知</td><td>0</td></tr>
   <tr><td>平均延遲</td><td>約 0 秒(到達即顯示)</td></tr>
  </table>
  <div class="log" id="s_log"></div>
 </div>
</div>

<script>
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const DURATION = 60;
const $ = id => document.getElementById(id);
const client = mqtt.connect(BROKER, { clientId: "lab_" + Math.random().toString(16).slice(2,10), clean: true });
let topic = null, running = false, t0 = 0, pollTimer = null, tick = null, botTimers = [];
let st = { req:0, hit:0, empty:0, msgs:0, push:0, delaySum:0 }, mailbox = [];

client.on("connect", () => $("conn").textContent = "已連線(wss 8884)");
client.on("reconnect", () => $("conn").textContent = "重新連線中…");
client.on("error", e => $("conn").textContent = "錯誤:" + e.message);
client.on("close", () => { if(!running) $("conn").textContent = "已中斷"; });

const room = () => $("room").value.trim().replace(/[\/+#\s]/g, "");
const nowStr = () => ((Date.now() - t0) / 1000).toFixed(1) + "s";
const addLog = (id, t) => { const d = document.createElement("div"); d.textContent = t; $(id).appendChild(d); $(id).scrollTop = 1e9; };

function render(){
  $("p_req").textContent = st.req; $("p_hit").textContent = st.hit; $("p_empty").textContent = st.empty;
  $("p_ratio").textContent = st.req ? Math.round(st.empty / st.req * 100) + "%" : "-";
  $("p_msgs").textContent = st.msgs;
  $("p_delay").textContent = st.msgs ? (st.delaySum / st.msgs / 1000).toFixed(1) + " 秒" : "-";
  $("s_msgs").textContent = st.push;
}

client.on("message", (tp, payload) => {
  if(!running || tp !== topic) return;
  let m; try { m = JSON.parse(payload.toString()); } catch { return; }
  st.push++; addLog("s_log", `${nowStr()} 即時收到:${m.text}`);
  mailbox.push({ text: m.text, arrive: Date.now() });
  render();
});

function doPoll(){
  st.req++;
  const items = mailbox.splice(0, mailbox.length);
  if(items.length){
    st.hit++; st.msgs += items.length;
    const now = Date.now();
    items.forEach(it => { st.delaySum += now - it.arrive; addLog("p_log", `${nowStr()} 詢問後取得:${it.text}`); });
  } else {
    st.empty++; addLog("p_log", `${nowStr()} 詢問:沒有新訊息`);
  }
  render();
}

function start(){
  if(!room()){ alert("請輸入 Room"); return; }
  if(!client.connected){ alert("尚未連線,請稍候"); return; }
  stop(false);
  topic = `cc-lab/${room()}/poll-demo`;
  st = { req:0, hit:0, empty:0, msgs:0, push:0, delaySum:0 };
  mailbox = [];
  $("p_log").textContent = ""; $("s_log").textContent = "";
  client.subscribe(topic, { qos: 0 });
  running = true; t0 = Date.now(); render();
  pollTimer = setInterval(doPoll, Number($("interval").value) * 1000);
  tick = setInterval(() => {
    const left = Math.max(0, DURATION - Math.floor((Date.now() - t0) / 1000));
    $("left").textContent = left; if(left <= 0) stop(true);
  }, 500);
}

function stop(done){
  clearInterval(pollTimer); clearInterval(tick); pollTimer = tick = null;
  if(topic && running){ client.unsubscribe(topic); }
  running = false;
  if(done) $("conn").textContent = "實驗完成,請記錄左右兩邊的數字";
}

function bot(){
  if(!room()){ alert("請輸入 Room"); return; }
  if(!client.connected){ alert("尚未連線,請稍候"); return; }
  botTimers.forEach(clearTimeout); botTimers = [];
  const tp = `cc-lab/${room()}/poll-demo`;
  for(let i = 1; i <= 5; i++){
    botTimers.push(setTimeout(() => {
      client.publish(tp, JSON.stringify({ text: `機器人訊息 ${i}`, i }), { qos: 0, retain: false });
    }, Math.random() * 50000));
  }
  alert("機器人已啟動:未來 50 秒內隨機發布 5 則訊息。請確保全組已按「開始實驗」。");
}

$("start").onclick = start;
$("stop").onclick = () => stop(true);
$("bot").onclick = bot;
</script>
</body>
</html>
